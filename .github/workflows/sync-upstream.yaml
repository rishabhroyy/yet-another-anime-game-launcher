name: "Sync upstream release"
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: yaagl/yet-another-anime-game-launcher

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: macos-latest
    steps:
      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh release view --repo "$UPSTREAM_REPO" --json tagName -q .tagName)
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have release $UPSTREAM_TAG, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release: $UPSTREAM_TAG"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge upstream
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags
          git merge "${{ steps.check.outputs.upstream_tag }}" --no-edit

      - name: Install UV
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sophon Build Cache
        if: steps.check.outputs.skip == 'false'
        id: sophon-build-cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Sophon Build
        if: steps.check.outputs.skip == 'false' && steps.sophon-build-cache.outputs.cache-hit != 'true'
        run: |
          ./build-sophon.sh

      - name: Save Sophon Build Cache
        if: steps.check.outputs.skip == 'false' && steps.sophon-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Install Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        if: steps.check.outputs.skip == 'false'
        name: Install pnpm
        id: pnpm-install
        with:
          version: 7
          run_install: false

      - name: Get pnpm store directory
        if: steps.check.outputs.skip == 'false'
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        if: steps.check.outputs.skip == 'false'
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pnpm install

      - name: Build hoyoplay app
        if: steps.check.outputs.skip == 'false'
        run: |
          ./configure.sh
          YAAGL_CHANNEL_CLIENT=hoyoplay node ./build-app.js

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          zip -r "Yaagl.OS.zip" "Yaagl OS.app"

      - name: Push merge commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          git push origin main
          git tag "${{ steps.check.outputs.upstream_tag }}"
          git push origin "${{ steps.check.outputs.upstream_tag }}"

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.upstream_tag }}" \
            --title "v${{ steps.check.outputs.upstream_tag }}" \
            Yaagl.OS.zip
