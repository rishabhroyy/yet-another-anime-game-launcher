name: "Sync upstream release"
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: yaagl/yet-another-anime-game-launcher

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $UPSTREAM_TAG"

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No upstream release found, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 1: do we already have this tag?
          if gh api "repos/${{ github.repository }}/git/ref/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_TAG already exists, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 2: do we already have a release with this tag?
          if gh api "repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Release $UPSTREAM_TAG already exists, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 3: is the upstream tag's commit already in our main branch?
          UPSTREAM_SHA=$(gh api "repos/$UPSTREAM_REPO/git/ref/tags/$UPSTREAM_TAG" --jq .object.sha 2>/dev/null || true)
          if [ -n "$UPSTREAM_SHA" ]; then
            OUR_COMMITS=$(gh api "repos/${{ github.repository }}/compare/${UPSTREAM_SHA}...main" --jq .status 2>/dev/null || true)
            if [ "$OUR_COMMITS" = "ahead" ] || [ "$OUR_COMMITS" = "identical" ]; then
              echo "Upstream commit $UPSTREAM_SHA already merged into main, skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "New upstream release $UPSTREAM_TAG needs building."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags
          git merge "${{ needs.check.outputs.upstream_tag }}" --no-edit

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sophon Build Cache
        id: sophon-build-cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Sophon Build
        if: steps.sophon-build-cache.outputs.cache-hit != 'true'
        run: |
          ./build-sophon.sh

      - name: Save Sophon Build Cache
        if: steps.sophon-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build hoyoplay app
        run: |
          ./configure.sh
          YAAGL_CHANNEL_CLIENT=hoyoplay node ./build-app.js

      - name: Package
        run: |
          zip -r "Yaagl.OS.zip" "Yaagl OS.app"

      - name: Push merge commit and tag
        run: |
          git push origin main
          git tag "${{ needs.check.outputs.upstream_tag }}"
          git push origin "${{ needs.check.outputs.upstream_tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check.outputs.upstream_tag }}" \
            --title "v${{ needs.check.outputs.upstream_tag }}" \
            Yaagl.OS.zip
