name: "Sync upstream release"
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: yaagl/yet-another-anime-game-launcher

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need_release: ${{ steps.check.outputs.need_release }}
      need_merge: ${{ steps.check.outputs.need_merge }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      release_exists: ${{ steps.check.outputs.release_exists }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $UPSTREAM_TAG"

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No upstream release found, skipping."
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "need_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_EXISTS=false
          RELEASE_EXISTS=false

          if gh api "repos/${{ github.repository }}/git/ref/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi
          if gh api "repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Tag and release $UPSTREAM_TAG already exist, nothing to do."
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "need_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "need_release=true" >> "$GITHUB_OUTPUT"

          # Is the upstream tag's commit already merged into our main branch?
          NEED_MERGE=true
          UPSTREAM_SHA=$(gh api "repos/$UPSTREAM_REPO/git/ref/tags/$UPSTREAM_TAG" --jq .object.sha 2>/dev/null || true)
          if [ -n "$UPSTREAM_SHA" ]; then
            OUR_STATUS=$(gh api "repos/${{ github.repository }}/compare/${UPSTREAM_SHA}...main" --jq .status 2>/dev/null || true)
            if [ "$OUR_STATUS" = "ahead" ] || [ "$OUR_STATUS" = "identical" ]; then
              echo "Upstream commit $UPSTREAM_SHA already merged into main."
              NEED_MERGE=false
            fi
          fi
          echo "need_merge=$NEED_MERGE" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.need_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge upstream
        if: needs.check.outputs.need_merge == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags
          if ! git merge "${{ needs.check.outputs.upstream_tag }}" --no-edit; then
            echo "::error::Merge conflict bringing in upstream tag ${{ needs.check.outputs.upstream_tag }}. Manual intervention required: resolve conflicts locally, merge, and push to main."
            git diff --name-only --diff-filter=U | sed 's/^/::error::Conflicting file: /'
            exit 1
          fi

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sophon Build
        run: |
          ./build-sophon.sh

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 7
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build hoyoplay app
        run: |
          ./configure.sh
          YAAGL_CHANNEL_CLIENT=hoyoplay node ./build-app.js
          YAAGL_CHANNEL_CLIENT=hoyoplaycn node ./build-app.js

      - name: Package
        run: |
          zip -r "Yaagl.OS.zip" "Yaagl OS.app"
          zip -r "Yaagl.CN.zip" "Yaagl CN.app"

      - name: Push merge commit
        if: needs.check.outputs.need_merge == 'true'
        run: |
          git push origin main

      - name: Create and push tag
        if: needs.check.outputs.tag_exists != 'true'
        run: |
          git tag "${{ needs.check.outputs.upstream_tag }}"
          git push origin "${{ needs.check.outputs.upstream_tag }}"

      - name: Create release
        if: needs.check.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check.outputs.upstream_tag }}" \
            --title "v${{ needs.check.outputs.upstream_tag }}" \
            Yaagl.OS.zip \
            Yaagl.CN.zip
